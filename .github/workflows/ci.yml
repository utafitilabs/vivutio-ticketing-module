name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ticketing_module_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      VIVUTIO_TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/ticketing_module_test?serverVersion=17&charset=utf8

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql
          coverage: none
          tools: composer:v2

      - run: composer validate --strict
      # `update`: a bundle is tested against what its constraints allow, and its
      # lock is not committed.
      - run: composer update --no-interaction --no-progress
      - run: composer check
