name: Release

# A tag of this repository is minted here and nowhere else: the head gate over
# the exact commit about to be tagged, the tag, Packagist listing it, then the
# released gate over what Packagist hands out.
#
#   gh workflow run release.yml --ref 0.1 -f version=0.1.0

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to tag, without the v, on this line (e.g. 0.1.0)
        required: true
      released-gate:
        description: Run the released gate. Off only while the skeleton has no release yet.
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  head:
    uses: utafitilabs/vivutio-devkit-module/.github/workflows/fleet-gate.yml@0.1
    with:
      mode: head
      expect-repository: vivutio-ticketing-module
      expect-sha: ${{ github.sha }}

  tag:
    needs: head
    uses: utafitilabs/vivutio-devkit-module/.github/workflows/tag.yml@0.1
    with:
      version: ${{ inputs.version }}
      package: vivutio/ticketing-module

  released:
    needs: tag
    if: inputs.released-gate
    uses: utafitilabs/vivutio-devkit-module/.github/workflows/fleet-gate.yml@0.1
    with:
      mode: released

  without-released-gate:
    needs: tag
    if: ${{ !inputs.released-gate }}
    runs-on: ubuntu-latest
    steps:
      - run: echo "The released gate was not run for v${{ inputs.version }}; it runs with the skeleton's first release." | tee -a "$GITHUB_STEP_SUMMARY"
